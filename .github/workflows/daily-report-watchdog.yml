name: Daily report cloud watchdog

on:
  workflow_dispatch:
    inputs:
      date:
        description: Report date to check, formatted as YYYY-MM-DD. Defaults to today's Shanghai date.
        required: false
        type: string
      force:
        description: Force a regeneration even if the watchdog thinks the report is healthy.
        required: false
        default: false
        type: boolean
  schedule:
    # 10:30 Asia/Shanghai: catch missing or delayed morning report.
    - cron: "30 2 * * *"
    # 15:30 Asia/Shanghai: catch failed afternoon retry or low-output days.
    - cron: "30 7 * * *"

permissions:
  contents: write

concurrency:
  group: crm-daily-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve report date
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            report_date="${{ inputs.date }}"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 1
          fi

          force_run="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            force_run="true"
          fi

          echo "REPORT_DATE=$report_date" >> "$GITHUB_ENV"
          echo "FORCE_RUN=$force_run" >> "$GITHUB_ENV"
          echo "RUN_SLOT=watchdog" >> "$GITHUB_ENV"
          echo "Watchdog checking $report_date; force=$force_run"

      - name: Inspect report health
        id: watchdog
        shell: bash
        run: |
          node scripts/daily-report-watchdog.mjs --date="$REPORT_DATE" --minCandidates=8 --minReviewCandidates=3 --github-output="$GITHUB_OUTPUT"

      - name: Fetch CRM dedupe index
        id: dedupe
        if: steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true'
        shell: bash
        env:
          CRM_AUTOMATION_TOKEN: ${{ secrets.CRM_AUTOMATION_TOKEN || secrets.CRM_ACCESS_TOKEN }}
        run: |
          if [ -z "$CRM_AUTOMATION_TOKEN" ]; then
            echo "No CRM_AUTOMATION_TOKEN or CRM_ACCESS_TOKEN secret configured; using report-history dedupe only."
            echo "index_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p data/runtime
          curl -fsS \
            -H "Authorization: Bearer $CRM_AUTOMATION_TOKEN" \
            "https://crm-pages.pages.dev/api/leads/dedupe-index" \
            -o data/runtime/crm-dedupe-index.json
          echo "index_args=--existingIndex=data/runtime/crm-dedupe-index.json" >> "$GITHUB_OUTPUT"

      - name: Generate daily report if unhealthy
        if: steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true'
        shell: bash
        run: |
          node automations/jobs/online_daily_runner.mjs --date="$REPORT_DATE" --maxCandidates=260 --maxSteamDetails=90 --minReviewLeads=18 --minMediaLeads=10 --minReviewBackfillScore=18 ${{ steps.dedupe.outputs.index_args }}

      - name: Validate daily report contract
        shell: bash
        run: |
          node scripts/validate-daily-contract.mjs --date="$REPORT_DATE"

      - name: Commit generated data
        id: commit
        if: steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/reports/$REPORT_DATE.json" "data/radar/$REPORT_DATE.json" "data/steam_trends/$REPORT_DATE.json"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes to commit."
          else
            git commit -m "Generate $REPORT_DATE online CRM automation"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync daily report into CRM
        id: sync
        if: steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true'
        shell: bash
        run: |
          set +e
          sync_url="https://crm-pages.pages.dev/api/reports/sync?date=$REPORT_DATE&force=1"
          response=""
          sync_status="failed"
          sync_attempts=0

          for attempt in 1 2 3 4 5; do
            sync_attempts="$attempt"
            echo "CRM sync attempt $attempt"
            response="$(curl -fsS "$sync_url" 2>&1)"
            curl_status=$?
            echo "$response"

            if [ "$curl_status" -ne 0 ]; then
              sync_status="failed"
            elif echo "$response" | grep -q '"synced":true'; then
              sync_status="success"
              break
            elif echo "$response" | grep -q '"error"'; then
              sync_status="failed"
              break
            fi

            sleep 12
          done

          echo "sync_status=$sync_status" >> "$GITHUB_OUTPUT"
          echo "sync_attempts=$sync_attempts" >> "$GITHUB_OUTPUT"
          echo "sync_response_b64=$(printf '%s' "$response" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Commit watchdog receipt
        if: always() && (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true')
        shell: bash
        env:
          GENERATED_CHANGED: ${{ steps.commit.outputs.changed }}
          SYNC_STATUS: ${{ steps.sync.outputs.sync_status }}
          SYNC_ATTEMPTS: ${{ steps.sync.outputs.sync_attempts }}
          SYNC_RESPONSE_B64: ${{ steps.sync.outputs.sync_response_b64 }}
          WATCHDOG_REASONS: ${{ steps.watchdog.outputs.reasons }}
          GITHUB_EVENT_NAME_VALUE: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE_VALUE: ${{ github.event.schedule }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/automation_runs
          node <<'NODE'
          const fs = require('node:fs');
          const response = Buffer.from(process.env.SYNC_RESPONSE_B64 || '', 'base64').toString('utf8');
          const reportDate = process.env.REPORT_DATE;
          const payload = {
            report_date: reportDate,
            slot: 'watchdog',
            status: process.env.SYNC_STATUS || 'unknown',
            attempts: Number(process.env.SYNC_ATTEMPTS || 0),
            generated_changed: process.env.GENERATED_CHANGED === 'true',
            watchdog_reasons: process.env.WATCHDOG_REASONS || '',
            event_name: process.env.GITHUB_EVENT_NAME_VALUE,
            event_schedule: process.env.GITHUB_EVENT_SCHEDULE_VALUE || null,
            run_id: process.env.GITHUB_RUN_ID_VALUE,
            run_number: process.env.GITHUB_RUN_NUMBER_VALUE,
            run_url: `https://github.com/${process.env.GITHUB_REPOSITORY_VALUE}/actions/runs/${process.env.GITHUB_RUN_ID_VALUE}`,
            captured_at: new Date().toISOString(),
            sync_response: response
          };
          fs.writeFileSync(`data/automation_runs/${reportDate}-watchdog.json`, `${JSON.stringify(payload, null, 2)}\n`);
          NODE

          git add "data/automation_runs/$REPORT_DATE-watchdog.json"
          if git diff --cached --quiet; then
            echo "No watchdog receipt changes to commit."
          else
            git commit -m "Record $REPORT_DATE watchdog automation sync"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if watchdog import quality is too low
        if: (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true') && steps.sync.outputs.sync_status == 'success'
        shell: bash
        env:
          SYNC_RESPONSE_B64: ${{ steps.sync.outputs.sync_response_b64 }}
          MIN_CREATED_UNPROCESSED: 6
        run: |
          node <<'NODE'
          const responseText = Buffer.from(process.env.SYNC_RESPONSE_B64 || '', 'base64').toString('utf8');
          let payload = null;
          try {
            payload = JSON.parse(responseText);
          } catch {
            console.log('Sync response is not JSON; skipping import quality gate.');
            process.exit(0);
          }
          const stats = payload.import_stats;
          if (!stats) {
            console.log('Sync response does not include import_stats yet; skipping import quality gate.');
            process.exit(0);
          }
          const minCreated = Number(process.env.MIN_CREATED_UNPROCESSED || 6);
          const created = Number(stats.created_unprocessed || 0);
          if (created < minCreated) {
            console.error(`CRM import quality too low: created_unprocessed=${created}, expected >= ${minCreated}.`);
            console.error(`stale_updates=${Number(stats.stale_updates || 0)}, visible_unprocessed=${Number(stats.visible_unprocessed || 0)}.`);
            process.exit(1);
          }
          console.log(`CRM import quality ok: created_unprocessed=${created}.`);
          NODE

      - name: Fail if watchdog sync did not succeed
        if: (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true') && steps.sync.outputs.sync_status != 'success'
        shell: bash
        run: |
          echo "Watchdog attempted regeneration but CRM sync did not confirm synced=true" >&2
          exit 1

      - name: Summary
        shell: bash
        run: |
          echo "Daily report watchdog finished for $REPORT_DATE"
          echo "needs_run=${{ steps.watchdog.outputs.needs_run }}"
          echo "reasons=${{ steps.watchdog.outputs.reasons }}"
