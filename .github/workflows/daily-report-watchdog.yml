name: Daily report cloud watchdog

on:
  workflow_dispatch:
    inputs:
      date:
        description: Report date to check, formatted as YYYY-MM-DD. Defaults to today's Shanghai date.
        required: false
        type: string
      force:
        description: Force a regeneration even if the watchdog thinks the report is healthy.
        required: false
        default: false
        type: boolean
  schedule:
    # 10:23-16:23 Asia/Shanghai: repeatedly catch missing, delayed, or failed cloud runs.
    # GitHub scheduled workflows are not guaranteed to fire exactly on the minute, so the
    # watchdog is intentionally separate from the primary report workflow and self-heals
    # throughout the working day.
    - cron: "23 2-8 * * *"

permissions:
  contents: write

concurrency:
  group: crm-daily-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve report date
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            report_date="${{ inputs.date }}"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 1
          fi

          force_run="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            force_run="true"
          fi

          echo "REPORT_DATE=$report_date" >> "$GITHUB_ENV"
          echo "FORCE_RUN=$force_run" >> "$GITHUB_ENV"
          echo "RUN_SLOT=watchdog" >> "$GITHUB_ENV"
          echo "Watchdog checking $report_date; force=$force_run"

      - name: Inspect report health
        id: watchdog
        shell: bash
        run: |
          node scripts/daily-report-watchdog.mjs --date="$REPORT_DATE" --github-output="$GITHUB_OUTPUT"

      - name: Fetch CRM dedupe index
        id: dedupe
        if: steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true'
        shell: bash
        env:
          CRM_AUTOMATION_TOKEN: ${{ secrets.CRM_AUTOMATION_TOKEN || secrets.CRM_ACCESS_TOKEN }}
        run: |
          if [ -z "$CRM_AUTOMATION_TOKEN" ]; then
            echo "No CRM_AUTOMATION_TOKEN or CRM_ACCESS_TOKEN secret configured; using report-history dedupe only."
            echo "index_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p data/runtime
          curl -fsS \
            -H "Authorization: Bearer $CRM_AUTOMATION_TOKEN" \
            "https://crm-pages.pages.dev/api/leads/dedupe-index" \
            -o data/runtime/crm-dedupe-index.json
          echo "index_args=--existingIndex=data/runtime/crm-dedupe-index.json" >> "$GITHUB_OUTPUT"

      - name: Generate daily report if unhealthy
        id: generate
        if: steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true'
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          node automations/jobs/online_daily_runner.mjs --date="$REPORT_DATE" --maxCandidates=260 --maxSteamDetails=90 --allowLowVolume=true ${{ steps.dedupe.outputs.index_args }} 2>&1 | tee "$log_file"
          status="${PIPESTATUS[0]}"
          set -e

          echo "generation_exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "generation_log_b64=$(tail -c 20000 "$log_file" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "generation_status=success" >> "$GITHUB_OUTPUT"
            echo "failure_stage=" >> "$GITHUB_OUTPUT"
            echo "failure_reason=" >> "$GITHUB_OUTPUT"
          else
            reason="$(tail -n 1 "$log_file" | tr '\n' ' ' | cut -c1-500)"
            echo "generation_status=failed" >> "$GITHUB_OUTPUT"
            echo "failure_stage=generation" >> "$GITHUB_OUTPUT"
            echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate daily report contract
        id: validate
        if: steps.generate.outputs.generation_status == 'success'
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          node scripts/validate-daily-contract.mjs --date="$REPORT_DATE" --allowLowVolume=true --requireSourcingCandidates=true 2>&1 | tee "$log_file"
          status="${PIPESTATUS[0]}"
          set -e

          echo "validation_exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "validation_log_b64=$(tail -c 20000 "$log_file" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "validation_status=success" >> "$GITHUB_OUTPUT"
          else
            reason="$(tail -n 1 "$log_file" | tr '\n' ' ' | cut -c1-500)"
            echo "validation_status=failed" >> "$GITHUB_OUTPUT"
            echo "failure_stage=validation" >> "$GITHUB_OUTPUT"
            echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated data
        id: commit
        if: (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true') && steps.generate.outputs.generation_status == 'success' && steps.validate.outputs.validation_status == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/reports/$REPORT_DATE.json" "data/radar/$REPORT_DATE.json" "data/steam_trends/$REPORT_DATE.json" "data/sourcing_candidates/$REPORT_DATE.json"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes to commit."
          else
            git commit -m "Generate $REPORT_DATE online CRM automation"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync daily report into CRM
        id: sync
        if: (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true') && steps.generate.outputs.generation_status == 'success' && steps.validate.outputs.validation_status == 'success'
        shell: bash
        env:
          CRM_AUTOMATION_TOKEN: ${{ secrets.CRM_AUTOMATION_TOKEN || secrets.CRM_ACCESS_TOKEN }}
        run: |
          set +e
          sync_url="https://crm-pages.pages.dev/api/reports/sync?date=$REPORT_DATE&force=1"
          response=""
          sync_status="failed"
          sync_attempts=0

          for attempt in 1 2 3 4 5; do
            sync_attempts="$attempt"
            echo "CRM sync attempt $attempt"
            curl_args=(-fsS)
            if [ -n "$CRM_AUTOMATION_TOKEN" ]; then
              curl_args+=(-H "Authorization: Bearer $CRM_AUTOMATION_TOKEN")
            fi
            response="$(curl "${curl_args[@]}" "$sync_url" 2>&1)"
            curl_status=$?
            echo "$response"

            if [ "$curl_status" -ne 0 ]; then
              sync_status="failed"
            elif echo "$response" | grep -q '"synced":true'; then
              sync_status="success"
              break
            elif echo "$response" | grep -q '"error"'; then
              sync_status="failed"
              break
            fi

            sleep 12
          done

          echo "sync_status=$sync_status" >> "$GITHUB_OUTPUT"
          echo "sync_attempts=$sync_attempts" >> "$GITHUB_OUTPUT"
          echo "sync_response_b64=$(printf '%s' "$response" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Commit watchdog receipt
        if: always() && (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true')
        shell: bash
        env:
          GENERATED_CHANGED: ${{ steps.commit.outputs.changed }}
          GENERATION_STATUS: ${{ steps.generate.outputs.generation_status }}
          GENERATION_EXIT_CODE: ${{ steps.generate.outputs.generation_exit_code }}
          GENERATION_LOG_B64: ${{ steps.generate.outputs.generation_log_b64 }}
          VALIDATION_STATUS: ${{ steps.validate.outputs.validation_status }}
          VALIDATION_EXIT_CODE: ${{ steps.validate.outputs.validation_exit_code }}
          VALIDATION_LOG_B64: ${{ steps.validate.outputs.validation_log_b64 }}
          SYNC_STATUS: ${{ steps.sync.outputs.sync_status }}
          SYNC_ATTEMPTS: ${{ steps.sync.outputs.sync_attempts }}
          SYNC_RESPONSE_B64: ${{ steps.sync.outputs.sync_response_b64 }}
          WATCHDOG_REASONS: ${{ steps.watchdog.outputs.reasons }}
          FAILURE_STAGE: ${{ steps.generate.outputs.failure_stage || steps.validate.outputs.failure_stage }}
          FAILURE_REASON: ${{ steps.generate.outputs.failure_reason || steps.validate.outputs.failure_reason }}
          GITHUB_EVENT_NAME_VALUE: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE_VALUE: ${{ github.event.schedule }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/automation_runs
          node <<'NODE'
          (async () => {
          const fs = require('node:fs');
          const { analyzeDailyLeadsLivenessFromRepository } = await import('./automations/jobs/online_daily_leads_liveness.mjs');
          const response = Buffer.from(process.env.SYNC_RESPONSE_B64 || '', 'base64').toString('utf8');
          const generationLogTail = Buffer.from(process.env.GENERATION_LOG_B64 || '', 'base64').toString('utf8');
          const validationLogTail = Buffer.from(process.env.VALIDATION_LOG_B64 || '', 'base64').toString('utf8');
          const reportDate = process.env.REPORT_DATE;
          const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT_VALUE);
          if (!Number.isSafeInteger(runAttempt) || runAttempt <= 0) {
            throw new Error('github.run_attempt must be a positive safe integer');
          }
          const generationStatus = process.env.GENERATION_STATUS || 'unknown';
          const validationStatus = process.env.VALIDATION_STATUS || 'unknown';
          const failurePayloadPath = `data/runtime/${reportDate}-generation-failure.json`;
          const failurePayload = fs.existsSync(failurePayloadPath)
            ? JSON.parse(fs.readFileSync(failurePayloadPath, 'utf8'))
            : null;
          const reportPayloadPath = `data/reports/${reportDate}.json`;
          const reportPayload = generationStatus === 'success' && fs.existsSync(reportPayloadPath)
            ? JSON.parse(fs.readFileSync(reportPayloadPath, 'utf8'))
            : null;
          const steamEvidenceLost = generationStatus === 'success'
            ? reportPayload?.diagnostics?.steam_evidence_lost ?? null
            : failurePayload?.diagnostics?.steam_evidence_lost ?? null;
          let businessLiveness = null;
          let businessLivenessError = null;
          if (generationStatus === 'success' && validationStatus === 'success') {
            try {
              businessLiveness = analyzeDailyLeadsLivenessFromRepository({
                rootDir: process.cwd(),
                endDate: reportDate,
                days: 15
              });
            } catch (error) {
              businessLivenessError = error instanceof Error ? error.message : String(error);
            }
          }
          let status = process.env.SYNC_STATUS || 'unknown';
          let failureStage = failurePayload?.failure_stage || process.env.FAILURE_STAGE || null;
          let failureReason = failurePayload?.failure_reason || process.env.FAILURE_REASON || null;
          if (generationStatus !== 'success') {
            status = 'generation_failed';
            failureStage ||= 'generation';
            failureReason ||= 'daily report generation failed';
          } else if (validationStatus !== 'success') {
            status = 'generation_failed';
            failureStage ||= 'validation';
            failureReason ||= 'daily report contract validation failed';
          }
          const payload = {
            report_date: reportDate,
            slot: 'watchdog',
            status,
            attempts: Number(process.env.SYNC_ATTEMPTS || 0),
            generated_changed: process.env.GENERATED_CHANGED === 'true',
            generation_status: generationStatus,
            generation_exit_code: Number(process.env.GENERATION_EXIT_CODE || 0),
            validation_status: validationStatus,
            validation_exit_code: Number(process.env.VALIDATION_EXIT_CODE || 0),
            failure_stage: failureStage,
            failure_reason: failureReason,
            volume_diagnostics: failurePayload?.volume_diagnostics ?? null,
            steam_evidence_lost: steamEvidenceLost,
            business_liveness_status: businessLiveness?.business_liveness_status ?? 'unavailable',
            business_liveness: businessLiveness,
            business_liveness_error: businessLivenessError,
            new_lead_count: businessLiveness?.current_day?.new_lead_count ?? null,
            consecutive_zero_days: businessLiveness?.consecutive_zero_days ?? null,
            top_blocking_gates: businessLiveness?.top_blocking_gates ?? [],
            generation_log_tail: generationLogTail,
            validation_log_tail: validationLogTail,
            watchdog_reasons: process.env.WATCHDOG_REASONS || '',
            event_name: process.env.GITHUB_EVENT_NAME_VALUE,
            event_schedule: process.env.GITHUB_EVENT_SCHEDULE_VALUE || null,
            run_id: process.env.GITHUB_RUN_ID_VALUE,
            run_attempt: runAttempt,
            run_number: process.env.GITHUB_RUN_NUMBER_VALUE,
            run_url: `https://github.com/${process.env.GITHUB_REPOSITORY_VALUE}/actions/runs/${process.env.GITHUB_RUN_ID_VALUE}`,
            captured_at: new Date().toISOString(),
            sync_response: response
          };
          fs.writeFileSync(`data/automation_runs/${reportDate}-watchdog.json`, `${JSON.stringify(payload, null, 2)}\n`);
          /* C5B_SHADOW_FINALIZER_START */
          try {
            const { finalizeC5BReplayCorpusSafely } = await import('./automations/jobs/online_daily_v7_3_shadow_collector.mjs');
            await finalizeC5BReplayCorpusSafely({
              rootDir: process.cwd(),
              reportDate,
              runSlot: 'watchdog',
              receiptPath: `data/automation_runs/${reportDate}-watchdog.json`
            });
          } catch (error) {
            console.warn(`C5-B shadow finalizer module-load isolated failure: ${String(error?.message ?? error)}`);
          }
          /* C5B_SHADOW_FINALIZER_END */
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          # C5B_SHADOW_CORPUS_ADD_START
          corpus_path="data/sourcing_replay_corpus/$REPORT_DATE/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-watchdog.json"
          if [ -f "$corpus_path" ]; then
            git add "$corpus_path"
          fi
          # C5B_SHADOW_CORPUS_ADD_END

          git add "data/automation_runs/$REPORT_DATE-watchdog.json"
          if git diff --cached --quiet; then
            echo "No watchdog receipt changes to commit."
          else
            git commit -m "Record $REPORT_DATE watchdog automation sync"
            if ! git diff --quiet -- data/reports data/radar data/steam_trends data/sourcing_candidates data/runtime || [ -n "$(git ls-files --others --exclude-standard data/reports data/radar data/steam_trends data/sourcing_candidates data/runtime)" ]; then
              echo "Stashing generated artifact residue before watchdog receipt rebase."
              git stash push --include-untracked -m "preserve failed generated artifacts before watchdog receipt push" -- data/reports data/radar data/steam_trends data/sourcing_candidates data/runtime
            fi
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record watchdog import quality
        if: (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true') && steps.generate.outputs.generation_status == 'success' && steps.validate.outputs.validation_status == 'success' && steps.sync.outputs.sync_status == 'success'
        shell: bash
        env:
          SYNC_RESPONSE_B64: ${{ steps.sync.outputs.sync_response_b64 }}
          MIN_CREATED_UNPROCESSED: 6
        run: |
          node <<'NODE'
          const responseText = Buffer.from(process.env.SYNC_RESPONSE_B64 || '', 'base64').toString('utf8');
          let payload = null;
          try {
            payload = JSON.parse(responseText);
          } catch {
            console.log('Sync response is not JSON; skipping import quality gate.');
            process.exit(0);
          }
          const stats = payload.import_stats;
          if (!stats) {
            console.log('Sync response does not include import_stats yet; skipping import quality gate.');
            process.exit(0);
          }
          const minCreated = Number(process.env.MIN_CREATED_UNPROCESSED || 6);
          const created = Number(stats.created_unprocessed || 0);
          if (created < minCreated) {
            console.warn(`CRM import volume is low but watchdog sync already succeeded: created_unprocessed=${created}, expected >= ${minCreated}.`);
            console.warn(`stale_updates=${Number(stats.stale_updates || 0)}, visible_unprocessed=${Number(stats.visible_unprocessed || 0)}.`);
            console.warn('The watchdog should not keep failing after a successful sync only because production dedupe converted new leads into updates.');
            process.exit(0);
          }
          console.log(`CRM import quality ok: created_unprocessed=${created}.`);
          NODE

      - name: Fail if watchdog sync did not succeed
        if: (steps.watchdog.outputs.needs_run == 'true' || env.FORCE_RUN == 'true') && (steps.generate.outputs.generation_status != 'success' || steps.validate.outputs.validation_status != 'success' || steps.sync.outputs.sync_status != 'success')
        shell: bash
        run: |
          echo "Watchdog attempted regeneration but did not reach generation+validation+sync success." >&2
          exit 1

      - name: Summary
        shell: bash
        run: |
          echo "Daily report watchdog finished for $REPORT_DATE"
          echo "needs_run=${{ steps.watchdog.outputs.needs_run }}"
          echo "reasons=${{ steps.watchdog.outputs.reasons }}"
