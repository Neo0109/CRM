name: Daily online CRM automation

on:
  workflow_dispatch:
    inputs:
      date:
        description: Report date to generate, formatted as YYYY-MM-DD. Defaults to today's Shanghai date.
        required: false
        type: string
      force:
        description: Force CRM sync after generation.
        required: false
        default: true
        type: boolean
  schedule:
    # 09:30 Asia/Shanghai.
    - cron: "30 1 * * *"
  push:
    branches:
      - main
    paths:
      - automations/jobs/online_daily.mjs
      - automations/jobs/online_daily_v2.mjs
      - automations/jobs/online_daily_v3.mjs
      - .github/workflows/sync-daily-report.yml

permissions:
  contents: write

concurrency:
  group: crm-online-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-sync:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Trigger unread triage patch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve report date
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            report_date="${{ inputs.date }}"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 1
          fi

          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          echo "REPORT_DATE=$report_date" >> "$GITHUB_ENV"
          echo "Generating online CRM automation for $report_date"

      - name: Generate daily report, radar, and Steam trends
        shell: bash
        run: |
          node automations/jobs/online_daily_v3.mjs --date="$REPORT_DATE"

      - name: Commit generated data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/reports/$REPORT_DATE.json" "data/radar/$REPORT_DATE.json" "data/steam_trends/$REPORT_DATE.json"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes to commit."
          else
            git commit -m "Generate $REPORT_DATE online CRM automation"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync daily report into CRM
        shell: bash
        run: |
          # Give raw.githubusercontent.com a short moment to serve the just-pushed JSON.
          sleep 8
          sync_url="https://crm-pages.pages.dev/api/reports/sync?date=$REPORT_DATE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "false" ]; then
            echo "Workflow dispatch force=false; syncing without force."
          else
            sync_url="$sync_url&force=1"
          fi
          response="$(curl -fsS "$sync_url")"
          echo "$response"

          if echo "$response" | grep -q '"error"'; then
            echo "CRM sync returned an error" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          echo "Generated and synced CRM data for $REPORT_DATE"
          echo "Files:"
          echo "- data/reports/$REPORT_DATE.json"
          echo "- data/radar/$REPORT_DATE.json"
          echo "- data/steam_trends/$REPORT_DATE.json"

  patch-unread-triage:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Trigger unread triage patch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply unread triage UX patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const appPath = 'app/frontend/src/App.tsx';
          let source = fs.readFileSync(appPath, 'utf8');

          function replaceOnce(input, needle, replacement, label) {
            if (!input.includes(needle)) {
              throw new Error(`Patch target not found: ${label}`);
            }
            return input.replace(needle, replacement);
          }

          source = source.replace(/const version = "v[^"]+";/, 'const version = "v1.5.2";');
          source = replaceOnce(
            source,
            '    label: lead.bucket === "淘汰池" ? "放入观察" : "转观察",',
            '    label: lead.bucket === "淘汰池" ? "放入观察" : lead.review_status === "未处理" ? "观望" : "转观察",',
            'watch action label'
          );
          source = replaceOnce(
            source,
            '    title: lead.bucket === "淘汰池" ? "从淘汰池恢复到观察池" : "转入观察池",',
            '    title: lead.bucket === "淘汰池" ? "从淘汰池恢复到观察池" : lead.review_status === "未处理" ? "暂时放入观察池" : "转入观察池",',
            'watch action title'
          );
          source = replaceOnce(
            source,
            '  if (missingLinksMode) return [follow, watch, drop];\n  if (lead.bucket === "淘汰池") return [follow, watch];',
            '  if (missingLinksMode) return [follow, watch, drop];\n  if (lead.review_status === "未处理") return [follow, watch, drop];\n  if (lead.bucket === "淘汰池") return [follow, watch];',
            'unread quick action branch'
          );

          fs.writeFileSync(appPath, source);

          fs.mkdirSync('docs/releases', { recursive: true });
          fs.writeFileSync('docs/releases/v1.5.2-unread-triage-actions.md', `# v1.5.2 未处理三分流

- 未处理标签页的列表和右侧详情统一提供“跟进 / 观望 / 淘汰”三个动作。
- “跟进”会进入跟进中，“观望”会进入观察池并标记已查看，“淘汰”会进入淘汰池。
- 处理后 lead 会自动离开未处理筛选，避免同一条线索被重复 review。
`);

          if (fs.existsSync('.github/workflows/one-off-unread-triage-patch.yml')) {
            fs.unlinkSync('.github/workflows/one-off-unread-triage-patch.yml');
          }
          NODE

      - name: Verify frontend build
        run: |
          npm install
          npm run build --workspace app/frontend

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unread lead triage actions"
          git pull --rebase origin main
          git push origin HEAD:main
