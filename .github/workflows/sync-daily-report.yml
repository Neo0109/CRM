name: Daily online CRM automation

on:
  workflow_dispatch:
    inputs:
      date:
        description: Report date to generate, formatted as YYYY-MM-DD. Defaults to today's Shanghai date.
        required: false
        type: string
      slot:
        description: Run slot label for traceability, such as morning, afternoon, or manual.
        required: false
        default: manual
        type: string
      force:
        description: Force CRM sync after generation.
        required: false
        default: true
        type: boolean
  schedule:
    # 09:30 Asia/Shanghai daily primary run.
    - cron: "30 1 * * *"
    # 14:00 Asia/Shanghai daily retry/new-batch run.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: crm-online-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve report date and run slot
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            report_date="${{ inputs.date }}"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.slot }}" ]; then
            run_slot="${{ inputs.slot }}"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            run_slot="morning"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            run_slot="afternoon"
          else
            run_slot="${{ github.event_name }}"
          fi

          run_slot="$(printf '%s' "$run_slot" | tr '[:upper:] ' '[:lower:]-' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-32)"
          if [ -z "$run_slot" ]; then
            run_slot="manual"
          fi

          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          echo "slot=$run_slot" >> "$GITHUB_OUTPUT"
          echo "REPORT_DATE=$report_date" >> "$GITHUB_ENV"
          echo "RUN_SLOT=$run_slot" >> "$GITHUB_ENV"
          echo "Generating online CRM automation for $report_date ($run_slot)"

      - name: Fetch CRM dedupe index
        id: dedupe
        shell: bash
        env:
          CRM_AUTOMATION_TOKEN: ${{ secrets.CRM_AUTOMATION_TOKEN || secrets.CRM_ACCESS_TOKEN }}
        run: |
          if [ -z "$CRM_AUTOMATION_TOKEN" ]; then
            echo "No CRM_AUTOMATION_TOKEN or CRM_ACCESS_TOKEN secret configured; using report-history dedupe only."
            echo "index_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p data/runtime
          curl -fsS \
            -H "Authorization: Bearer $CRM_AUTOMATION_TOKEN" \
            "https://crm-pages.pages.dev/api/leads/dedupe-index" \
            -o data/runtime/crm-dedupe-index.json
          echo "index_args=--existingIndex=data/runtime/crm-dedupe-index.json" >> "$GITHUB_OUTPUT"

      - name: Generate daily report, radar, and Steam trends
        shell: bash
        run: |
          node automations/jobs/online_daily_runner.mjs --date="$REPORT_DATE" --maxCandidates=260 --maxSteamDetails=90 --minReviewLeads=18 --minMediaLeads=10 --minReviewBackfillScore=18 ${{ steps.dedupe.outputs.index_args }}

      - name: Validate daily report contract
        shell: bash
        run: |
          node scripts/validate-daily-contract.mjs --date="$REPORT_DATE"

      - name: Commit generated data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/reports/$REPORT_DATE.json" "data/radar/$REPORT_DATE.json" "data/steam_trends/$REPORT_DATE.json"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes to commit."
          else
            git commit -m "Generate $REPORT_DATE online CRM automation"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync daily report into CRM
        id: sync
        shell: bash
        run: |
          set +e
          sync_url="https://crm-pages.pages.dev/api/reports/sync?date=$REPORT_DATE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "false" ]; then
            echo "Workflow dispatch force=false; syncing without force."
          else
            sync_url="$sync_url&force=1"
          fi

          response=""
          sync_status="failed"
          sync_attempts=0
          for attempt in 1 2 3 4 5; do
            sync_attempts="$attempt"
            echo "CRM sync attempt $attempt"
            response="$(curl -fsS "$sync_url" 2>&1)"
            curl_status=$?
            echo "$response"

            if [ "$curl_status" -ne 0 ]; then
              sync_status="failed"
            elif echo "$response" | grep -q '"synced":true'; then
              sync_status="success"
              break
            elif echo "$response" | grep -q '"error"'; then
              sync_status="failed"
              break
            fi

            sleep 12
          done

          echo "sync_status=$sync_status" >> "$GITHUB_OUTPUT"
          echo "sync_attempts=$sync_attempts" >> "$GITHUB_OUTPUT"
          echo "sync_response_b64=$(printf '%s' "$response" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Commit sync receipt
        if: always()
        shell: bash
        env:
          GENERATED_CHANGED: ${{ steps.commit.outputs.changed }}
          SYNC_STATUS: ${{ steps.sync.outputs.sync_status }}
          SYNC_ATTEMPTS: ${{ steps.sync.outputs.sync_attempts }}
          SYNC_RESPONSE_B64: ${{ steps.sync.outputs.sync_response_b64 }}
          GITHUB_EVENT_NAME_VALUE: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE_VALUE: ${{ github.event.schedule }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/automation_runs
          node <<'NODE'
          const fs = require('node:fs');
          const response = Buffer.from(process.env.SYNC_RESPONSE_B64 || '', 'base64').toString('utf8');
          const reportDate = process.env.REPORT_DATE;
          const runSlot = process.env.RUN_SLOT;
          const payload = {
            report_date: reportDate,
            slot: runSlot,
            status: process.env.SYNC_STATUS || 'unknown',
            attempts: Number(process.env.SYNC_ATTEMPTS || 0),
            generated_changed: process.env.GENERATED_CHANGED === 'true',
            event_name: process.env.GITHUB_EVENT_NAME_VALUE,
            event_schedule: process.env.GITHUB_EVENT_SCHEDULE_VALUE || null,
            run_id: process.env.GITHUB_RUN_ID_VALUE,
            run_number: process.env.GITHUB_RUN_NUMBER_VALUE,
            run_url: `https://github.com/${process.env.GITHUB_REPOSITORY_VALUE}/actions/runs/${process.env.GITHUB_RUN_ID_VALUE}`,
            captured_at: new Date().toISOString(),
            sync_response: response
          };
          fs.writeFileSync(`data/automation_runs/${reportDate}-${runSlot}.json`, `${JSON.stringify(payload, null, 2)}\n`);
          NODE

          git add "data/automation_runs/$REPORT_DATE-$RUN_SLOT.json"
          if git diff --cached --quiet; then
            echo "No automation sync receipt changes to commit."
          else
            git commit -m "Record $REPORT_DATE $RUN_SLOT automation sync"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record CRM import quality
        if: steps.sync.outputs.sync_status == 'success'
        shell: bash
        env:
          SYNC_RESPONSE_B64: ${{ steps.sync.outputs.sync_response_b64 }}
          MIN_CREATED_UNPROCESSED: 6
        run: |
          node <<'NODE'
          const responseText = Buffer.from(process.env.SYNC_RESPONSE_B64 || '', 'base64').toString('utf8');
          let payload = null;
          try {
            payload = JSON.parse(responseText);
          } catch {
            console.log('Sync response is not JSON; skipping import quality gate.');
            process.exit(0);
          }
          const stats = payload.import_stats;
          if (!stats) {
            console.log('Sync response does not include import_stats yet; skipping import quality gate.');
            process.exit(0);
          }
          const minCreated = Number(process.env.MIN_CREATED_UNPROCESSED || 6);
          const created = Number(stats.created_unprocessed || 0);
          const visible = Number(stats.visible_unprocessed || 0);
          const updatedVisible = Number(stats.updated_unprocessed_visible || 0);
          const usefulInbox = created + updatedVisible + visible;
          if (created < minCreated && usefulInbox < minCreated * 2) {
            console.warn(`CRM import volume is low but sync already succeeded: created_unprocessed=${created}, useful_inbox=${usefulInbox}.`);
            console.warn(`updated_visible=${updatedVisible}, visible_unprocessed=${visible}, stale_updates=${Number(stats.stale_updates || 0)}.`);
            console.warn('Low newly-created count usually means production dedupe matched existing leads; do not fail an otherwise successful daily sync on this alone.');
            process.exit(0);
          }
          console.log(`CRM import quality ok: created_unprocessed=${created}, useful_inbox=${usefulInbox}.`);
          NODE

      - name: Fail if CRM sync did not succeed
        if: steps.sync.outputs.sync_status != 'success'
        shell: bash
        run: |
          echo "CRM sync did not confirm synced=true" >&2
          exit 1

      - name: Summary
        shell: bash
        run: |
          echo "Generated and synced CRM data for $REPORT_DATE ($RUN_SLOT)"
          echo "Files:"
          echo "- data/reports/$REPORT_DATE.json"
          echo "- data/radar/$REPORT_DATE.json"
          echo "- data/steam_trends/$REPORT_DATE.json"
          echo "- data/automation_runs/$REPORT_DATE-$RUN_SLOT.json"
