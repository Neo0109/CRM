name: Daily online CRM automation

on:
  workflow_dispatch:
    inputs:
      date:
        description: Report date to generate, formatted as YYYY-MM-DD. Defaults to today's Shanghai date.
        required: false
        type: string
      force:
        description: Force CRM sync after generation.
        required: false
        default: true
        type: boolean
  schedule:
    # 09:30 Asia/Shanghai.
    - cron: "30 1 * * *"
  push:
    branches:
      - main
    paths:
      - automations/jobs/online_daily.mjs
      - .github/workflows/sync-daily-report.yml

permissions:
  contents: write

concurrency:
  group: crm-online-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve report date
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            report_date="${{ inputs.date }}"
          else
            report_date="$(TZ=Asia/Shanghai date +%F)"
          fi

          if ! [[ "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 1
          fi

          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          echo "REPORT_DATE=$report_date" >> "$GITHUB_ENV"
          echo "Generating online CRM automation for $report_date"

      - name: Generate daily report, radar, and Steam trends
        shell: bash
        run: |
          node automations/jobs/online_daily.mjs --date="$REPORT_DATE"

      - name: Commit generated data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/reports/$REPORT_DATE.json" "data/radar/$REPORT_DATE.json" "data/steam_trends/$REPORT_DATE.json"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes to commit."
          else
            git commit -m "Generate $REPORT_DATE online CRM automation"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync daily report into CRM
        shell: bash
        run: |
          # Give raw.githubusercontent.com a short moment to serve the just-pushed JSON.
          sleep 8
          response="$(curl -fsS "https://crm-pages.pages.dev/api/reports/sync?date=$REPORT_DATE&force=1")"
          echo "$response"

          if echo "$response" | grep -q '"error"'; then
            echo "CRM sync returned an error" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          echo "Generated and synced CRM data for $REPORT_DATE"
          echo "Files:"
          echo "- data/reports/$REPORT_DATE.json"
          echo "- data/radar/$REPORT_DATE.json"
          echo "- data/steam_trends/$REPORT_DATE.json"
