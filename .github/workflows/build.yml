name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/**

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch diff
        run: git diff --check origin/main...HEAD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test frontend
        run: npm run test:frontend
      - name: Typecheck frontend
        run: npm run typecheck --workspace app/frontend
      - name: Typecheck Functions
        run: npm run typecheck:functions
      - name: Test CRM core
        run: npm run test:crm-core
      - name: Test Steam review opportunity source
        run: node --test automations/test/steamReviewOpportunity*.test.mjs
      - name: Test visual AI manual audit
        run: node --test automations/test/visualAi*.test.mjs
      - name: Test Daily Leads liveness replay
        run: node --test automations/test/dailyLeadsLivenessReplay.test.mjs
      - name: Build frontend
        run: npm run build --workspace app/frontend
